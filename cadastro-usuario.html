<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário - Conecta ESG</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }

        h1 {
            color: #2d6a4f;
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
        }

        .campo {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        .btn-cadastrar {
            width: 100%;
            padding: 10px;
            background-color: #52b788;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-cadastrar:hover {
            background-color: #2d6a4f;
        }

        .voltar {
            text-align: center;
            margin-top: 15px;
        }

        .voltar a {
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }

        .voltar a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h1>Cadastro de Usuário / Comunidade</h1>

        <!-- Formulário para o cidadão ou líder comunitário cadastrar sua necessidade -->
        <form>
            <div class="campo">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" placeholder="Seu nome" required>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Crie uma senha" required>
            </div>

            <div class="campo">
                <label for="necessidade">Qual a necessidade da sua comunidade?</label>
                <textarea id="necessidade" placeholder="Ex: Precisamos de computadores ou oficinas..." required></textarea>
            </div>

            <button type="submit" class="btn-cadastrar">Finalizar Cadastro</button>
        </form>

        <div class="voltar">
            <a href="login.html">← Voltar para a Tela de Login</a>
        </div>
    </div>

</body>
</html>
