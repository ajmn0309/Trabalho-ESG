<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Empresa - Conecta ESG</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }

        h1 {
            color: #1b4332;
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
        }

        .campo {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .btn-cadastrar {
            width: 100%;
            padding: 10px;
            background-color: #2d6a4f;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-cadastrar:hover {
            background-color: #1b4332;
        }

        .voltar {
            text-align: center;
            margin-top: 15px;
        }

        .voltar a {
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }

        .voltar a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h1>Cadastro de Empresa (ESG)</h1>

        <!-- Formulário para empresas que buscam se adequar aos pilares ESG -->
        <form>
            <div class="campo">
                <label for="empresa">Nome da Empresa</label>
                <input type="text" id="empresa" placeholder="Razão social ou nome fantasia" required>
            </div>

            <div class="campo">
                <label for="cnpj">CNPJ</label>
                <input type="text" id="cnpj" placeholder="00.000.000/0001-00" required>
            </div>

            <div class="campo">
                <label for="email">E-mail Corporativo</label>
                <input type="email" id="email" placeholder="contato@empresa.com" required>
            </div>

            <div class="campo">
                <label for="pilar">Principal Pilar ESG de Interesse</label>
                <select id="pilar" required>
                    <option value="">Selecione...</option>
                    <option value="E">Ambiental (E)</option>
                    <option value="S">Social (S)</option>
                    <option value="G">Governança (G)</option>
                </select>
            </div>

            <button type="submit" class="btn-cadastrar">Cadastrar Empresa</button>
        </form>

        <div class="voltar">
            <a href="login.html">← Voltar para a Tela de Login</a>
        </div>
    </div>

</body>
</html>
